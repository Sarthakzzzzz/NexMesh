apiVersion: v1
kind: Service
metadata:
  name: nvflare-server
spec:
  type: NodePort
  selector:
    app: nvflare-server
  ports:
    - name: federated-learning
      port: 8002
      targetPort: 8002
      nodePort: 30002
    - name: admin
      port: 8003
      targetPort: 8003
      nodePort: 30003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nvflare-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nvflare-server
  template:
    metadata:
      labels:
        app: nvflare-server
    spec:
      hostAliases:
        - ip: "127.0.0.1"
          hostnames:
            - "192.168.1.43"
      containers:
        - name: nvflare-server
          image: fedlearn/nvflare:local
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "rm -f /workspace/pid.fl /workspace/daemon_pid.fl /workspace/restart.fl /workspace/shutdown.fl && exec /workspace/startup/sub_start.sh --once"]
          ports:
            - containerPort: 8002
            - containerPort: 8003
          volumeMounts:
            - name: server-kit
              mountPath: /workspace
            - name: server-test
              mountPath: /data/server_test
              readOnly: true
            - name: server-results
              mountPath: /results
      volumes:
        - name: server-kit
          hostPath:
            path: /nvflare-kits/192.168.1.43
            type: Directory
        - name: server-test
          hostPath:
            path: /datasets/server_test
            type: Directory
        - name: server-results
          hostPath:
            path: /nvflare-results
            type: DirectoryOrCreate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nvflare-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nvflare-admin
  template:
    metadata:
      labels:
        app: nvflare-admin
    spec:
      hostAliases:
        - ip: "127.0.0.1"
          hostnames:
            - "192.168.1.43"
      containers:
        - name: admin
          image: fedlearn/nvflare:local
          imagePullPolicy: IfNotPresent
          command: ["sleep", "infinity"]
          volumeMounts:
            - name: admin-kit
              mountPath: /workspace
      volumes:
        - name: admin-kit
          hostPath:
            path: /nvflare-kits/admin@nvidia.com
            type: Directory

