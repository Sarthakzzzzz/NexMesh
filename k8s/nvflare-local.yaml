apiVersion: v1
kind: Service
metadata:
  name: nvflare-server
spec:
  type: NodePort
  selector:
    app: nvflare-server
  ports:
    - name: federated-learning
      port: 8002
      targetPort: 8002
      nodePort: 30002
    - name: admin
      port: 8003
      targetPort: 8003
      nodePort: 30003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nvflare-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nvflare-server
  template:
    metadata:
      labels:
        app: nvflare-server
    spec:
      hostAliases:
        - ip: "127.0.0.1"
          hostnames:
            - "192.168.1.43"
      containers:
        - name: nvflare-server
          image: fedlearn/nvflare:local
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "rm -f /workspace/pid.fl /workspace/daemon_pid.fl /workspace/restart.fl /workspace/shutdown.fl && exec /workspace/startup/sub_start.sh --once"]
          ports:
            - containerPort: 8002
            - containerPort: 8003
          volumeMounts:
            - name: server-kit
              mountPath: /workspace
            - name: server-test
              mountPath: /data/server_test
              readOnly: true
            - name: server-results
              mountPath: /results
      volumes:
        - name: server-kit
          hostPath:
            path: /nvflare-kits/192.168.1.43
            type: Directory
        - name: server-test
          hostPath:
            path: /datasets/server_test
            type: Directory
        - name: server-results
          hostPath:
            path: /nvflare-results
            type: DirectoryOrCreate
---
# NVFlare site clients — each trains on its own local data, never shares raw data
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nvflare-site-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nvflare-site-1
  template:
    metadata:
      labels:
        app: nvflare-site-1
    spec:
      hostAliases:
        - ip: "127.0.0.1"
          hostnames:
            - "192.168.1.43"
      containers:
        - name: nvflare-site-1
          image: fedlearn/nvflare:local
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "exec /workspace/startup/sub_start.sh --once"]
          env:
            - name: NEXMESH_DATA_PATH
              value: "/data/site-1/mnist.pt"
            - name: NEXMESH_EPOCHS
              value: "1"
            - name: NEXMESH_BATCH_SIZE
              value: "64"
          ports:
            - containerPort: 8002
          volumeMounts:
            - name: site-1-kit
              mountPath: /workspace
            - name: site-1-data
              mountPath: /data/site-1
              readOnly: true
      volumes:
        - name: site-1-kit
          hostPath:
            path: /nvflare-kits/site-1
            type: Directory
        - name: site-1-data
          hostPath:
            path: /datasets/site-1
            type: Directory
---
