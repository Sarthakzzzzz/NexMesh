apiVersion: apps/v1
kind: Deployment
metadata:
  name: nvflare-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nvflare-admin
  template:
    metadata:
      labels:
        app: nvflare-admin
    spec:
      hostAliases:
        - ip: "127.0.0.1"
          hostnames:
            - "192.168.1.43"
      containers:
        - name: admin
          image: fedlearn/nvflare:local
          imagePullPolicy: IfNotPresent
          command: ["sleep", "infinity"]
          volumeMounts:
            - name: admin-kit
              mountPath: /workspace
      volumes:
        - name: admin-kit
          hostPath:
            path: /nvflare-kits/admin@nvidia.com
            type: Directory
