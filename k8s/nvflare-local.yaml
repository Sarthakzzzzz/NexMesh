apiVersion: v1
kind: Service
metadata:
  name: server1
spec:
  selector:
    app: server1
  ports:
    - name: federated-learning
      port: 8002
      targetPort: 8002
    - name: admin
      port: 8003
      targetPort: 8003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server1
  template:
    metadata:
      labels:
        app: server1
    spec:
      containers:
        - name: server1
          image: fedlearn/nvflare:local
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "rm -f /workspace/pid.fl /workspace/daemon_pid.fl /workspace/restart.fl /workspace/shutdown.fl && exec /workspace/startup/sub_start.sh --once"]
          ports:
            - containerPort: 8002
            - containerPort: 8003
          volumeMounts:
            - name: server-kit
              mountPath: /workspace
            - name: server-test
              mountPath: /data/server_test
              readOnly: true
            - name: server-results
              mountPath: /results
      volumes:
        - name: server-kit
          hostPath:
            path: /nvflare-kits/server1
            type: Directory
        - name: server-test
          hostPath:
            path: /datasets/server_test
            type: Directory
        - name: server-results
          hostPath:
            path: /nvflare-results
            type: DirectoryOrCreate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: site-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: site-1
  template:
    metadata:
      labels:
        app: site-1
    spec:
      runtimeClassName: nvidia
      containers:
        - name: site-1
          image: fedlearn/nvflare:local
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "rm -f /workspace/pid.fl /workspace/daemon_pid.fl /workspace/restart.fl /workspace/shutdown.fl && exec /workspace/startup/sub_start.sh --once"]
          volumeMounts:
            - name: site-kit
              mountPath: /workspace
            - name: site-data
              mountPath: /data/client_1
              readOnly: true
          resources:
            limits:
              nvidia.com/gpu: 1
          securityContext:
            privileged: true
      volumes:
        - name: site-kit
          hostPath:
            path: /nvflare-kits/site-1
            type: Directory
        - name: site-data
          hostPath:
            path: /datasets/client_1
            type: Directory
---
